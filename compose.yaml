services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    volumes:
      - ./src:/app/src

    command: >
      sh -c "python src/drf_recipe_api/manage.py runserver 0.0.0.0:8000"

    env_file:
      - .env

    depends_on:
      - db

  db:
    image: postgres:18.0

    volumes:
      - dev-db-data:/var/lib/postgresql

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}

volumes:
  dev-db-data: